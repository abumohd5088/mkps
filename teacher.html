<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Teacher Portal | Milli Karwaan Public School</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    body { font-family: 'Poppins', sans-serif; background: #f8fafc; }
    .card { @apply bg-white rounded-xl shadow-lg p-6 mb-4; }
    .btn-primary { @apply bg-blue-700 hover:bg-blue-800 text-white px-4 py-2 rounded-lg transition; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<!-- Login Screen -->
<div id="loginScreen" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-900 to-indigo-800">
  <div class="bg-white p-8 rounded-2xl shadow-2xl max-w-md w-full text-center">
    <img src="https://imglink.io/i/5f766005-40e7-4481-a3b4-d672c084b363.jpeg" class="w-20 h-20 mx-auto rounded-full mb-4 object-cover"/>
    <h2 class="text-2xl font-bold text-gray-800 mb-2">Teacher Login</h2>
    <p class="text-gray-600 mb-6">Sign in to manage homework, notifications & more</p>
    <button id="googleLoginBtn" class="btn-primary w-full flex items-center justify-center gap-2">
      <i class="fab fa-google"></i> Sign in with Google
    </button>
    <p id="loginError" class="text-red-500 text-sm mt-3 hidden"></p>
  </div>
</div>

<!-- Dashboard (Hidden until login) -->
<div id="dashboard" class="hidden min-h-screen">
  <!-- Header -->
  <header class="bg-blue-900 text-white p-4 shadow-lg">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <img src="https://imglink.io/i/5f766005-40e7-4481-a3b4-d672c084b363.jpeg" class="w-10 h-10 rounded-full object-cover"/>
        <div>
          <h1 class="font-bold">Milli Karwaan Public School</h1>
          <p class="text-xs text-blue-200">Teacher Portal</p>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <span id="teacherName" class="text-sm"></span>
        <button id="logoutBtn" class="bg-red-500 hover:bg-red-600 px-3 py-1 rounded text-sm">Logout</button>
      </div>
    </div>
  </header>

  <!-- Main Content -->  <main class="max-w-6xl mx-auto p-4 grid md:grid-cols-2 gap-6">
    
    <!-- Post Homework -->
    <div class="card">
      <h3 class="font-bold text-lg mb-4 text-blue-800"><i class="fas fa-book mr-2"></i>Post Homework</h3>
      <form id="homeworkForm">
        <select id="hwClass" required class="w-full p-2 border rounded mb-3">
          <option value="">Select Class</option>
          <option value="1">Class 1</option><option value="2">Class 2</option>
          <option value="3">Class 3</option><option value="4">Class 4</option>
          <option value="5">Class 5</option><option value="6">Class 6</option>
          <option value="7">Class 7</option><option value="8">Class 8</option>
        </select>
        <input type="text" id="hwSubject" placeholder="Subject (e.g., Mathematics)" required class="w-full p-2 border rounded mb-3"/>
        <textarea id="hwDescription" placeholder="Assignment details..." required class="w-full p-2 border rounded mb-3" rows="3"></textarea>
        <input type="date" id="hwDueDate" required class="w-full p-2 border rounded mb-3"/>
        <button type="submit" class="btn-primary w-full">📤 Post Homework</button>
      </form>
      <p id="hwStatus" class="text-sm mt-2"></p>
    </div>

    <!-- Send Notification -->
    <div class="card">
      <h3 class="font-bold text-lg mb-4 text-blue-800"><i class="fas fa-bell mr-2"></i>Send Notification</h3>
      <form id="notificationForm">
        <input type="text" id="notifTitle" placeholder="Title (e.g., Holiday Alert)" required class="w-full p-2 border rounded mb-3"/>
        <textarea id="notifMessage" placeholder="Message content..." required class="w-full p-2 border rounded mb-3" rows="3"></textarea>
        <select id="notifPriority" class="w-full p-2 border rounded mb-3">
          <option value="normal">Normal Priority</option>
          <option value="high">🔴 High Priority</option>
          <option value="urgent">🚨 Urgent</option>
        </select>
        <button type="submit" class="btn-primary w-full bg-orange-600 hover:bg-orange-700">🔔 Send Notification</button>
      </form>
      <p id="notifStatus" class="text-sm mt-2"></p>
    </div>

    <!-- Update Timetable -->
    <div class="card">
      <h3 class="font-bold text-lg mb-4 text-blue-800"><i class="fas fa-calendar-alt mr-2"></i>Update Timetable</h3>
      <form id="timetableForm">
        <select id="ttClass" required class="w-full p-2 border rounded mb-3">
          <option value="">Select Class</option>
          <option value="1">Class 1</option><option value="2">Class 2</option>
          <option value="3">Class 3</option><option value="4">Class 4</option>
          <option value="5">Class 5</option><option value="6">Class 6</option>
          <option value="7">Class 7</option><option value="8">Class 8</option>
        </select>
        <textarea id="ttContent" placeholder="Paste timetable (Mon-Fri schedule)..." required class="w-full p-2 border rounded mb-3" rows="4"></textarea>
        <button type="submit" class="btn-primary w-full bg-green-600 hover:bg-green-700">📅 Save Timetable</button>      </form>
      <p id="ttStatus" class="text-sm mt-2"></p>
    </div>

    <!-- Mark Attendance -->
    <div class="card">
      <h3 class="font-bold text-lg mb-4 text-blue-800"><i class="fas fa-clipboard-list mr-2"></i>Mark Attendance</h3>
      <form id="attendanceForm">
        <select id="attClass" required class="w-full p-2 border rounded mb-3">
          <option value="">Select Class</option>
          <option value="1">Class 1</option><option value="2">Class 2</option>
          <option value="3">Class 3</option><option value="4">Class 4</option>
          <option value="5">Class 5</option><option value="6">Class 6</option>
          <option value="7">Class 7</option><option value="8">Class 8</option>
        </select>
        <input type="date" id="attDate" required class="w-full p-2 border rounded mb-3"/>
        <textarea id="attData" placeholder="Format: RollNo:Present/Absent (e.g., 1:P,2:A,3:P)" class="w-full p-2 border rounded mb-3" rows="3"></textarea>
        <button type="submit" class="btn-primary w-full bg-purple-600 hover:bg-purple-700">✅ Save Attendance</button>
      </form>
      <p id="attStatus" class="text-sm mt-2"></p>
    </div>

    <!-- View Messages -->
    <div class="card md:col-span-2">
      <h3 class="font-bold text-lg mb-4 text-blue-800"><i class="fas fa-envelope mr-2"></i>Parent Messages</h3>
      <div id="messagesList" class="space-y-3 max-h-64 overflow-y-auto">
        <p class="text-gray-500 text-sm">Loading messages...</p>
      </div>
    </div>

  </main>
</div>

<!-- Firebase SDKs -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getFirestore, collection, addDoc, serverTimestamp, query, orderBy, onSnapshot, limit } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  // 🔑 Your Firebase Config
  const firebaseConfig = {
    apiKey: "AIzaSyB0fHtqeoerlckQ2RXx_VC86cZz_BJaIIU",
    authDomain: "mkps-balrampur.firebaseapp.com",
    projectId: "mkps-balrampur",
    storageBucket: "mkps-balrampur.firebasestorage.app",
    messagingSenderId: "469227187804",
    appId: "1:469227187804:web:8abdb9b75ed05b7eadc099",
    measurementId: "G-TYKBNS9SX2"
  };
  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();

  // DOM Elements
  const loginScreen = document.getElementById('loginScreen');
  const dashboard = document.getElementById('dashboard');
  const googleLoginBtn = document.getElementById('googleLoginBtn');
  const logoutBtn = document.getElementById('logoutBtn');
  const teacherName = document.getElementById('teacherName');
  const loginError = document.getElementById('loginError');

  // 🔐 Google Login
  googleLoginBtn.addEventListener('click', async () => {
    try {
      loginError.classList.add('hidden');
      const result = await signInWithPopup(auth, provider);
      console.log('Logged in:', result.user.displayName);
    } catch (error) {
      loginError.textContent = "Login failed: " + error.message;
      loginError.classList.remove('hidden');
    }
  });

  // 🚪 Logout
  logoutBtn.addEventListener('click', async () => {
    await signOut(auth);
    window.location.reload();
  });

  // 👤 Auth State Observer
  onAuthStateChanged(auth, (user) => {
    if (user) {
      loginScreen.classList.add('hidden');
      dashboard.classList.remove('hidden');
      teacherName.textContent = user.displayName;
      loadMessages(); // Start listening to messages
    } else {
      loginScreen.classList.remove('hidden');
      dashboard.classList.add('hidden');
    }
  });

  // 📤 Post Homework
  document.getElementById('homeworkForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const status = document.getElementById('hwStatus');
    status.textContent = "Posting...";    
    try {
      await addDoc(collection(db, "homework"), {
        class: document.getElementById('hwClass').value,
        subject: document.getElementById('hwSubject').value,
        description: document.getElementById('hwDescription').value,
        dueDate: document.getElementById('hwDueDate').value,
        postedBy: auth.currentUser.displayName,
        postedAt: serverTimestamp()
      });
      status.textContent = "✅ Homework posted successfully!";
      status.className = "text-green-600 text-sm mt-2";
      e.target.reset();
      setTimeout(() => status.textContent = "", 3000);
    } catch (err) {
      status.textContent = "❌ Error: " + err.message;
      status.className = "text-red-600 text-sm mt-2";
    }
  });

  // 🔔 Send Notification
  document.getElementById('notificationForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const status = document.getElementById('notifStatus');
    status.textContent = "Sending...";
    
    try {
      await addDoc(collection(db, "notifications"), {
        title: document.getElementById('notifTitle').value,
        message: document.getElementById('notifMessage').value,
        priority: document.getElementById('notifPriority').value,
        sentBy: auth.currentUser.displayName,
        sentAt: serverTimestamp()
      });
      status.textContent = "✅ Notification sent to all parents!";
      status.className = "text-green-600 text-sm mt-2";
      e.target.reset();
      setTimeout(() => status.textContent = "", 3000);
    } catch (err) {
      status.textContent = "❌ Error: " + err.message;
      status.className = "text-red-600 text-sm mt-2";
    }
  });

  // 📅 Save Timetable
  document.getElementById('timetableForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const status = document.getElementById('ttStatus');
    status.textContent = "Saving...";
        try {
      // First delete old timetable for this class (optional)
      await addDoc(collection(db, "timetable"), {
        class: document.getElementById('ttClass').value,
        content: document.getElementById('ttContent').value,
        updatedBy: auth.currentUser.displayName,
        updatedAt: serverTimestamp()
      });
      status.textContent = "✅ Timetable updated!";
      status.className = "text-green-600 text-sm mt-2";
      e.target.reset();
      setTimeout(() => status.textContent = "", 3000);
    } catch (err) {
      status.textContent = "❌ Error: " + err.message;
      status.className = "text-red-600 text-sm mt-2";
    }
  });

  // ✅ Save Attendance
  document.getElementById('attendanceForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const status = document.getElementById('attStatus');
    status.textContent = "Saving...";
    
    try {
      await addDoc(collection(db, "attendance"), {
        class: document.getElementById('attClass').value,
        date: document.getElementById('attDate').value,
        data: document.getElementById('attData').value,
        markedBy: auth.currentUser.displayName,
        markedAt: serverTimestamp()
      });
      status.textContent = "✅ Attendance saved!";
      status.className = "text-green-600 text-sm mt-2";
      e.target.reset();
      setTimeout(() => status.textContent = "", 3000);
    } catch (err) {
      status.textContent = "❌ Error: " + err.message;
      status.className = "text-red-600 text-sm mt-2";
    }
  });

  // 📨 Load Messages (Real-time)
  function loadMessages() {
    const messagesList = document.getElementById('messagesList');
    const q = query(collection(db, "messages"), orderBy("timestamp", "desc"), limit(10));
    
    onSnapshot(q, (snapshot) => {
      messagesList.innerHTML = "";
      if (snapshot.empty) {        messagesList.innerHTML = "<p class='text-gray-500 text-sm'>No messages yet</p>";
        return;
      }
      snapshot.forEach(doc => {
        const msg = doc.data();
        const div = document.createElement('div');
        div.className = "bg-gray-50 p-3 rounded border-l-4 border-blue-500";
        div.innerHTML = `
          <div class="flex justify-between text-xs text-gray-500 mb-1">
            <span>${msg.class ? 'Class '+msg.class : 'General'}</span>
            <span>${msg.timestamp?.toDate().toLocaleString()}</span>
          </div>
          <p class="font-medium">${msg.name || 'Parent'}: ${msg.message}</p>
          <p class="text-xs text-gray-400 mt-1">${msg.email || ''}</p>
        `;
        messagesList.appendChild(div);
      });
    });
  }
</script>
</body>
</html>
